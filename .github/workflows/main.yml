name: RDP Windows 10 - 16GB RAM + GPU

on:
  workflow_dispatch:
    inputs:
      duracion:
        description: 'Duración (minutos)'
        required: false
        default: '360'

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 660

    steps:
      # 1. Configuración rápida de idioma español
      - name: Configurar español
        run: |
          Set-WinSystemLocale -SystemLocale es-ES
          Set-WinUserLanguageList -LanguageList es-ES -Force
          Set-TimeZone -Id "Romance Standard Time"

      # 2. Habilitar GPU y RDP optimizado
      - name: Configurar RDP con GPU
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MaxColorDepth" -Value 4 -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fEnableWddmDriver" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "EnableRemoteFx" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force

      # 3. Crear usuario administrador
      - name: Crear usuario
        run: |
          $pass = "${{ secrets.RDP_PASSWORD }}"
          if (-not $pass) { 
            Add-Type -AssemblyName System.Web
            $pass = [System.Web.Security.Membership]::GeneratePassword(16,4) 
          }
          New-LocalUser -Name "Admin" -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -AccountNeverExpires
          Add-LocalGroupMember -Group "Administradores" -Member "Admin"
          Add-LocalGroupMember -Group "Usuarios de Escritorio Remoto" -Member "Admin"
          echo "RDP_PASS=$pass" >> $env:GITHUB_ENV
          echo "RDP_USER=Admin" >> $env:GITHUB_ENV

      # 4. Instalar Tailscale (rápido)
      - name: Instalar Tailscale
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ts.msi" -UseBasicParsing
          Start-Process msiexec -ArgumentList "/i `"$env:TEMP\ts.msi`" /quiet /norestart" -Wait

      # 5. Conectar Tailscale
      - name: Conectar Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=rdp-$env:GITHUB_RUN_ID --reset
          for ($i=0; $i -lt 10; $i++) {
            $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            if ($ip) { echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV; break }
            Start-Sleep -Seconds 3
          }

      # 6. Mostrar credenciales (solo la IP y usuario, la pass está en el log)
      - name: Mostrar acceso
        run: |
          Write-Host "`n=== CONEXIÓN RDP ==="
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "Usuario: $env:RDP_USER"
          Write-Host "Contraseña: $env:RDP_PASS"
          Write-Host "Duración: ${{ github.event.inputs.duracion }} min"
          Write-Host "==================="

      # 7. Mantener activo durante 6 horas (con monitoreo ligero)
      - name: Mantener sesión
        run: |
          $fin = (Get-Date).AddMinutes([int]${{ github.event.inputs.duracion }})
          while ((Get-Date) -lt $fin) {
            $rest = [math]::Round(($fin - (Get-Date)).TotalMinutes)
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Restan $rest min"
            Start-Sleep -Seconds 60
          }
