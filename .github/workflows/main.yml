name: RDP

on:
  workflow_dispatch:
    inputs:
      duracion:
        description: 'Duración (minutos)'
        required: false
        default: '360'

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 660

    steps:
      # 1. Configuración RDP + GPU (rápido)
      - name: Configurar RDP y GPU
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MaxColorDepth" -Value 4 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fEnableWddmDriver" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "EnableRemoteFx" -Value 1 -Force
          netsh advfirewall firewall delete rule name="RDP" 2>$null
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force

      # 2. Crear usuario RDP (generación de contraseña sin System.Web)
      - name: Crear usuario RDP
        run: |
          $pass = "${{ secrets.RDP_PASSWORD }}"
          if (-not $pass) {
            $chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-='
            $pass = -join ((1..16) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          }
          $securePass = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASS=$pass" >> $env:GITHUB_ENV
          echo "RDP_USER=RDP" >> $env:GITHUB_ENV

      # 3. Instalar Tailscale (solo ~40 MB)
      - name: Instalar Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile "$env:TEMP\ts.msi" -UseBasicParsing
          Start-Process msiexec -ArgumentList "/i `"$env:TEMP\ts.msi`" /quiet /norestart" -Wait

      # 4. Conectar Tailscale
      - name: Conectar Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID --reset
          for ($i=0; $i -lt 10; $i++) {
            $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            if ($ip) { echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV; break }
            Start-Sleep -Seconds 3
          }

      # 5. Mostrar credenciales y guardarlas en archivo
      - name: Mostrar y guardar credenciales
        run: |
          # Crear archivo con credenciales
          $creds = @"
          =====================================
                 RDP ACCESS
          =====================================
          IP:       $env:TAILSCALE_IP
          Usuario:  $env:RDP_USER
          Contraseña: $env:RDP_PASS
          Duración: ${{ github.event.inputs.duracion }} minutos
          =====================================
          "@
          $creds | Out-File -FilePath "$env:GITHUB_WORKSPACE\credenciales.txt" -Encoding UTF8
          
          # Mostrar en logs
          Write-Host "`n====================================="
          Write-Host "           RDP ACCESS"
          Write-Host "====================================="
          Write-Host "IP:       $env:TAILSCALE_IP"
          Write-Host "Usuario:  $env:RDP_USER"
          Write-Host "Contraseña: $env:RDP_PASS"
          Write-Host "Duración: ${{ github.event.inputs.duracion }} minutos"
          Write-Host "====================================="
          Write-Host ""
          Write-Host "✅ Las credenciales están en el archivo: credenciales.txt"
          Write-Host "   Puedes descargarlo desde la sección de 'Artifacts' de esta ejecución."

      # 6. Subir credenciales como artefacto (para descargar fácilmente)
      - name: Subir credenciales
        uses: actions/upload-artifact@v4
        with:
          name: credenciales-rdp
          path: credenciales.txt
          retention-days: 1

      # 7. Mantener sesión por el tiempo elegido
      - name: Mantener activo
        run: |
          $fin = (Get-Date).AddMinutes([int]${{ github.event.inputs.duracion }})
          while ((Get-Date) -lt $fin) {
            $rest = [math]::Round(($fin - (Get-Date)).TotalMinutes)
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Restan $rest min"
            Start-Sleep -Seconds 60
          }
