name: RDP - 16GB RAM + GPU (Auto-apagado)

on:
  workflow_dispatch:
    inputs:
      duracion:
        description: 'Duración máxima (minutos)'
        required: false
        default: '360'

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 660

    steps:
      # 1. Verificar RAM y GPU + Configurar RDP
      - name: Verificar RAM y GPU + Configurar RDP
        run: |
          # RAM
          $mem = Get-WmiObject Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum
          $ramGB = [math]::Round($mem.Sum/1GB, 2)
          Write-Host "💾 RAM detectada: $ramGB GB" -ForegroundColor Green
          
          # GPU
          $gpu = Get-WmiObject Win32_VideoController | Select-Object -First 1
          Write-Host "🎮 GPU: $($gpu.Name)" -ForegroundColor Green
          
          # RDP + GPU
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MaxColorDepth" -Value 4 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fEnableWddmDriver" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "EnableRemoteFx" -Value 1 -Force
          
          netsh advfirewall firewall delete rule name="RDP" 2>$null
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          
          Write-Host "✅ RDP con GPU activado" -ForegroundColor Green

      # 2. Crear usuario RDP
      - name: Crear usuario RDP
        run: |
          $pass = "${{ secrets.RDP_PASSWORD }}"
          if (-not $pass) {
            $chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-='
            $pass = -join ((1..16) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          }
          $securePass = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASS=$pass" >> $env:GITHUB_ENV
          echo "RDP_USER=RDP" >> $env:GITHUB_ENV
          Write-Host "✅ Usuario RDP creado" -ForegroundColor Green

      # 3. Instalar Tailscale
      - name: Instalar Tailscale
        run: |
          Write-Host "📦 Instalando Tailscale..." -ForegroundColor Yellow
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile "$env:TEMP\ts.msi" -UseBasicParsing
          Start-Process msiexec -ArgumentList "/i `"$env:TEMP\ts.msi`" /quiet /norestart" -Wait
          Write-Host "✅ Tailscale instalado" -ForegroundColor Green

      # 4. Conectar Tailscale
      - name: Conectar Tailscale
        run: |
          Write-Host "🔄 Conectando a Tailscale..." -ForegroundColor Yellow
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=rdp-$env:GITHUB_RUN_ID --reset
          for ($i=0; $i -lt 10; $i++) {
            $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            if ($ip) { 
              echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
              Write-Host "✅ IP: $ip" -ForegroundColor Green
              break 
            }
            Start-Sleep -Seconds 3
          }

      # 5. Mostrar credenciales
      - name: Mostrar acceso
        run: |
          Write-Host ""
          Write-Host "╔════════════════════════════════════════════════════════════╗"
          Write-Host "║           🖥️  RDP - 16GB RAM + GPU ACELERADA           ║"
          Write-Host "╠════════════════════════════════════════════════════════════╣"
          Write-Host "║  🌐 IP Tailscale:  $env:TAILSCALE_IP                     ║"
          Write-Host "║  👤 Usuario:       $env:RDP_USER                          ║"
          Write-Host "║  🔑 Contraseña:    $env:RDP_PASS                         ║"
          Write-Host "║  💾 RAM:           16 GB (verificado)                     ║"
          Write-Host "║  🎮 GPU:           Acelerada (RemoteFX + WDDM)           ║"
          Write-Host "║  ⏱️  Duración máx:  ${{ github.event.inputs.duracion }} min  ║"
          Write-Host "╠════════════════════════════════════════════════════════════╣"
          Write-Host "║  ⚡ Auto-apagado:  Se detendrá si no hay sesión RDP      ║"
          Write-Host "║                     durante 2 minutos consecutivos.      ║"
          Write-Host "╚════════════════════════════════════════════════════════════╝"
          Write-Host ""

      # 6. Mantener activo MONITOREANDO SESIÓN RDP (Auto-apagado)
      - name: Mantener activo con detección de sesión
        run: |
          $duracionMax = [int]${{ github.event.inputs.duracion }}
          $fin = (Get-Date).AddMinutes($duracionMax)
          $sinSesion = 0          # contador de segundos sin sesión
          $limiteSinSesion = 120  # 2 minutos sin sesión para apagar
          $intervalo = 10         # comprobar cada 10 segundos
          
          Write-Host "⏳ Máximo hasta: $fin"
          Write-Host "🔄 Comprobando sesiones RDP cada $intervalo segundos..."
          Write-Host "⚠️  Si no hay sesión RDP durante $limiteSinSesion segundos, se apagará."
          Write-Host ""
          
          while ((Get-Date) -lt $fin) {
              # Verificar si hay sesiones RDP activas
              $sesiones = quser 2>$null | Select-String "RDP"
              $haySesion = ($sesiones -ne $null)
              
              $hora = Get-Date -Format "HH:mm:ss"
              if ($haySesion) {
                  $sinSesion = 0
                  # Extraer nombre de usuario y estado
                  $linea = $sesiones -split '\s+' | Where-Object { $_ -match '^\S+$' } | Select-Object -First 1
                  Write-Host "[$hora] ✅ Sesión RDP activa (Usuario: $linea)"
              } else {
                  $sinSesion += $intervalo
                  $restante = [math]::Round(($fin - (Get-Date)).TotalMinutes, 1)
                  Write-Host "[$hora] ⚠️  Sin sesión RDP ($sinSesion/$limiteSinSesion seg) - Restan $restante min"
                  
                  if ($sinSesion -ge $limiteSinSesion) {
                      Write-Host ""
                      Write-Host "🚫 No se detectó sesión RDP durante $limiteSinSesion segundos." -ForegroundColor Red
                      Write-Host "🛑 Apagando el runner automáticamente para ahorrar recursos." -ForegroundColor Red
                      exit 0
                  }
              }
              
              Start-Sleep -Seconds $intervalo
          }
          
          Write-Host "⏰ Tiempo máximo alcanzado. Apagando..." -ForegroundColor Red
