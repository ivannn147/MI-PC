name: RDP - 16GB RAM + GPU

on:
  workflow_dispatch:
    inputs:
      duracion:
        description: 'Duración (minutos)'
        required: false
        default: '360'

jobs:
  secure-rdp:
    runs-on: windows-latest  # Este runner tiene 16 GB de RAM
    timeout-minutes: 660     # 11 horas (suficiente para 6h + margen)

    steps:
      # ============================================================
      # PASO 1: Verificar recursos (RAM + GPU) y configurar RDP
      # ============================================================
      - name: Verificar RAM y GPU + Configurar RDP
        run: |
          # ---------- VERIFICACIÓN DE 16 GB RAM ----------
          $mem = Get-WmiObject Win32_PhysicalMemory | Measure-Object -Property Capacity -Sum
          $ramGB = [math]::Round($mem.Sum/1GB, 2)
          Write-Host "💾 RAM detectada: $ramGB GB" -ForegroundColor Green
          if ($ramGB -lt 15) {
            Write-Warning "⚠️  El runner no tiene 16 GB, tiene $ramGB GB"
          } else {
            Write-Host "✅ RAM: 16 GB (correcto)" -ForegroundColor Green
          }
          
          # ---------- VERIFICACIÓN DE GPU ----------
          $gpu = Get-WmiObject Win32_VideoController | Select-Object -First 1
          Write-Host "🎮 GPU detectada: $($gpu.Name)" -ForegroundColor Green
          Write-Host "   Driver: $($gpu.DriverVersion)"
          
          # ---------- CONFIGURAR RDP CON GPU ----------
          # Habilitar RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          
          # Seguridad: NLA activado (más seguro)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          
          # ---------- ACTIVAR ACELERACIÓN GPU ----------
          # Color de 32 bits (calidad máxima)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MaxColorDepth" -Value 4 -Force
          
          # WDDM: driver gráfico moderno (mejor rendimiento)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "fEnableWddmDriver" -Value 1 -Force
          
          # RemoteFX: aceleración de gráficos por hardware
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "EnableRemoteFx" -Value 1 -Force
          
          Write-Host "✅ GPU acelerada: RemoteFX + WDDM activados" -ForegroundColor Green
          
          # Firewall: permitir RDP
          netsh advfirewall firewall delete rule name="RDP" 2>$null
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          
          # Reiniciar servicio RDP
          Restart-Service -Name TermService -Force
          
          Write-Host "✅ RDP configurado con aceleración gráfica" -ForegroundColor Green

      # ============================================================
      # PASO 2: Crear usuario RDP con contraseña (rápido)
      # ============================================================
      - name: Crear usuario RDP
        run: |
          $pass = "${{ secrets.RDP_PASSWORD }}"
          if (-not $pass) {
            # Generar contraseña segura de 16 caracteres
            $chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-='
            $pass = -join ((1..16) | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          }
          $securePass = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASS=$pass" >> $env:GITHUB_ENV
          echo "RDP_USER=RDP" >> $env:GITHUB_ENV
          Write-Host "✅ Usuario RDP creado" -ForegroundColor Green

      # ============================================================
      # PASO 3: Instalar Tailscale (solo ~40 MB)
      # ============================================================
      - name: Instalar Tailscale
        run: |
          Write-Host "📦 Descargando Tailscale..." -ForegroundColor Yellow
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile "$env:TEMP\ts.msi" -UseBasicParsing
          Start-Process msiexec -ArgumentList "/i `"$env:TEMP\ts.msi`" /quiet /norestart" -Wait
          Write-Host "✅ Tailscale instalado" -ForegroundColor Green

      # ============================================================
      # PASO 4: Conectar Tailscale (obtener IP)
      # ============================================================
      - name: Conectar Tailscale
        run: |
          Write-Host "🔄 Conectando a Tailscale..." -ForegroundColor Yellow
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=rdp-$env:GITHUB_RUN_ID --reset
          for ($i=0; $i -lt 10; $i++) {
            $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            if ($ip) { 
              echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
              Write-Host "✅ IP asignada: $ip" -ForegroundColor Green
              break 
            }
            Start-Sleep -Seconds 3
          }

      # ============================================================
      # PASO 5: Mostrar credenciales de acceso
      # ============================================================
      - name: Mostrar acceso
        run: |
          Write-Host ""
          Write-Host "╔════════════════════════════════════════════════════════════╗"
          Write-Host "║           🖥️  RDP - 16GB RAM + GPU ACELERADA           ║"
          Write-Host "╠════════════════════════════════════════════════════════════╣"
          Write-Host "║                                                            ║"
          Write-Host "║  🌐 IP Tailscale:  $env:TAILSCALE_IP                     ║"
          Write-Host "║  👤 Usuario:       $env:RDP_USER                          ║"
          Write-Host "║  🔑 Contraseña:    $env:RDP_PASS                         ║"
          Write-Host "║  💾 RAM:           16 GB (verificado)                     ║"
          Write-Host "║  🎮 GPU:           Acelerada (RemoteFX + WDDM)           ║"
          Write-Host "║  ⏱️  Duración:      ${{ github.event.inputs.duracion }} minutos  ║"
          Write-Host "║                                                            ║"
          Write-Host "╠════════════════════════════════════════════════════════════╣"
          Write-Host "║  📌 CONECTAR:                                             ║"
          Write-Host "║  • Cliente RDP (mstsc) →  IP: $env:TAILSCALE_IP         ║"
          Write-Host "║  • Usuario: RDP  |  Contraseña: (la de arriba)           ║"
          Write-Host "║  • Experiencia gráfica optimizada                        ║"
          Write-Host "╚════════════════════════════════════════════════════════════╝"
          Write-Host ""

      # ============================================================
      # PASO 6: Mantener sesión activa durante X horas
      # ============================================================
      - name: Mantener activo
        run: |
          $fin = (Get-Date).AddMinutes([int]${{ github.event.inputs.duracion }})
          Write-Host "⏳ Sesión activa hasta: $fin" -ForegroundColor Yellow
          Write-Host "⚠️  Presiona Ctrl+C en la interfaz de GitHub para terminar antes" -ForegroundColor Yellow
          Write-Host ""
          
          while ((Get-Date) -lt $fin) {
            $rest = [math]::Round(($fin - (Get-Date)).TotalMinutes)
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] ⏱️  Restan $rest minutos"
            Start-Sleep -Seconds 60
          }
          
          Write-Host "⏰ Tiempo agotado. Cerrando sesión..." -ForegroundColor Red
